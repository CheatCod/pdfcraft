[package]
name = "pdfcraft-xfa"
description = "XFA forms: reads a dynamic form's XDP packets and lays its template out as PDF pages and AcroForm fields"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-fonts = { workspace = true }
roxmltree = "0.20"
base64 = "0.22"
png = "0.18"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["gif", "tiff", "bmp"] }
thiserror = { workspace = true }
serde_json = { workspace = true }
rxing = { version = "=0.9.3", default-features = false, features = ["pdf417", "encoders", "encoding_rs"] }

[dev-dependencies]
rxing = { version = "=0.9.3", default-features = false, features = ["pdf417", "decoders", "encoding_rs"] }
